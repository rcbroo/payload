services:
  eureka:
    build:
      context: .
      dockerfile: ./services/eureka/Dockerfile
    image: payload/eureka:dev
    environment:
      - EUREKA_INSTANCE_HOSTNAME=eureka
    ports:
      - "8761:8761"

  conductor-server:
    image: orkesio/orkes-conductor-server:latest
    environment:
      - CONFIG_PROP=config-local
    ports:
      - "7101:7101"

  conductor-ui:
    image: orkesio/orkes-conductor-ui:latest
    environment:
      - WF_SERVER=http://conductor-server:7101
    ports:
      - "5000:5000"
    depends_on:
      - conductor-server

  owl-adapter:
    build:
      context: .
      dockerfile: ./services/owl-adapter/Dockerfile
    image: payload/owl-adapter:dev
    environment:
      - PORT=7010
    ports:
      - "7010:7010"

  java-gateway:
    build:
      context: ./services/java-gateway
    image: payload/java-gateway:dev
    environment:
      - EUREKA_URL=http://eureka:8761/eureka
      - GATEWAY_HYSTRIX_ENABLED=false
    ports:
      - "8080:8080"
    depends_on:
      - eureka
      - node-cms
      - python-ai
      - rust-hp
      - go-concurrency

  node-cms:
    build:
      context: .
      dockerfile: ./services/node-cms/Dockerfile
    image: payload/node-cms:dev
    environment:
      - PORT=50051
      - OWL_ADAPTER_URL=http://owl-adapter:7010
    ports:
      - "50051:50051"

  python-ai:
    build:
      context: ./services/python-ai
    image: payload/python-ai:dev

  rust-hp:
    build:
      context: ./services/rust-hp
    image: payload/rust-hp:dev

  go-concurrency:
    build:
      context: ./services/go-concurrency
    image: payload/go-concurrency:dev
